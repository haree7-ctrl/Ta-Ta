<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#171923;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.top{height:64px;background:#fff;border-bottom:1px solid #e7e7ee;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-weight:800;display:flex;gap:9px;align-items:center}.brand-icon{width:36px;height:36px;border-radius:10px;object-fit:cover}.logo{width:34px;height:34px;border-radius:11px;background:#171923;color:#fff;display:grid;place-items:center}.top button{border:1px solid #dddde5;background:#fff;border-radius:10px;padding:8px 11px}.layout{display:grid;grid-template-columns:250px 1fr;max-width:1400px;margin:auto;min-height:calc(100vh - 64px)}aside{border-right:1px solid #e7e7ee;padding:20px 12px}.sidehead{font-size:10px;letter-spacing:.14em;color:#888996;font-weight:800;padding:0 8px 10px}.trip{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:12px;display:flex;gap:9px;margin-bottom:4px}.trip:hover,.trip.active{background:#fff;box-shadow:0 3px 12px #1518270d}.trip .pin{width:34px;height:34px;border-radius:10px;background:#eeeef4;display:grid;place-items:center}.trip.active .pin{background:#171923;color:#fff}.trip b{font-size:12px;display:block}.trip small{font-size:10px;color:#92939e}.new{margin-top:8px;width:100%;padding:10px;border-radius:11px;border:1px dashed #c9cad3;background:transparent;color:#555762}.main{padding:32px 38px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:40px;letter-spacing:-.05em;margin:5px 0}.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:900;color:#8d8e99}.muted{color:#7f808b;font-size:12px;line-height:1.55}.actions{display:flex;gap:8px}.primary,.secondary{border-radius:10px;padding:10px 14px;font-weight:750;display:inline-flex;gap:7px;align-items:center}.primary{background:#171923;color:#fff;border:0}.secondary{background:#fff;border:1px solid #dddde5}.danger{color:#a52820}.banner{background:#fff0ef;color:#a52820;border:1px solid #ffd5d0;padding:10px 12px;border-radius:10px;font-size:11px;margin-bottom:14px}.summary,.day,.details,.maplist{background:#fff;border:1px solid #e6e6ed;border-radius:16px}.summary{padding:13px 15px;margin-bottom:14px;font-size:12px;color:#696a76}.tabs{display:flex;gap:3px;background:#ebebf1;padding:4px;border-radius:11px;width:max-content;margin-bottom:15px}.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-size:11px;color:#747580;font-weight:700}.tabs button.active{background:#fff;color:#171923}.day{padding:18px;margin-bottom:14px}.dayhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.dayhead h3{margin:4px 0 0;font-size:19px}.verify{font-size:11px;padding:8px 10px;border:1px solid #dddde5;background:#fff;border-radius:9px}.row{display:grid;grid-template-columns:55px 14px 1fr;gap:8px;margin-top:16px}.time{font-size:10px;color:#92939e;text-align:right;padding-top:3px}.dot{width:8px;height:8px;background:#171923;border-radius:50%;margin-top:6px;position:relative}.dot:after{content:"";position:absolute;width:1px;background:#dddde5;top:11px;bottom:-80px;left:3.5px}.row:last-child .dot:after{display:none}.act{padding-bottom:15px}.act h4{font-size:14px;margin:2px 0}.tag{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#999aa5;font-weight:800}.act p{font-size:11px;color:#7b7c87;line-height:1.5;margin:4px 0 8px}.unverified{font-size:10px;color:#92939e;border:1px dashed #d8d8e1;padding:7px 9px;border-radius:9px}.place{border:1px solid #e1e1e8;border-radius:11px;padding:9px;margin-top:7px}.place b{font-size:11px}.place small{display:block;color:#858692;font-size:10px;margin-top:2px}.rating{font-size:10px;color:#866d00;margin-top:4px}.placeactions{display:flex;gap:10px;margin-top:7px;font-size:10px}.mapgrid{display:grid;grid-template-columns:350px 1fr;gap:14px}.maplist{padding:12px;max-height:650px;overflow:auto}.maplist h3{font-size:13px;margin:4px 3px 10px}.mapcanvas{min-height:620px;border-radius:16px;overflow:hidden;background:#e8e8ed;border:1px solid #dddde5}.empty{background:#fff;border:1px dashed #d5d5de;border-radius:16px;min-height:250px;display:grid;place-items:center;text-align:center;padding:25px;color:#858692}.empty b{color:#252631;display:block;margin:7px}.details{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e7e7ee}.details div{background:#fff;padding:18px}.details b,.details span{display:block;font-size:11px}.details span{color:#858692;margin-top:4px}.modalback{position:fixed;inset:0;background:#11121c77;backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:start}.modal h2{margin:4px 0 16px;font-size:24px}.close{border:1px solid #dddde5;background:#fff;border-radius:9px;padding:7px}.modal label{display:block;font-size:10px;font-weight:800;color:#555762;margin:12px 0 5px}.modal input,.modal select,.modal textarea{width:100%;border:1px solid #dddde5;border-radius:9px;padding:10px;outline:none}.modal textarea{min-height:80px;resize:vertical}.grid2,.grid3{display:grid;gap:10px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:10px;color:#888995;margin-top:5px}.keysbox{background:#f7f7fa;border:1px solid #e6e6ed;border-radius:11px;padding:11px;margin-top:12px;font-size:10px}.keysbox span{display:block;margin-top:4px;color:#777883}.iterations{background:#fff;border:1px solid #e6e6ed;border-radius:14px;padding:12px;margin-bottom:14px}.iterhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.iterhead b{font-size:12px}.iterlist{display:flex;gap:7px;overflow:auto}.iter{min-width:150px;text-align:left;border:1px solid #e1e1e8;background:#fafafd;border-radius:10px;padding:9px;position:relative}.iter.active{border-color:#171923;background:#f2f2f6}.iter strong{display:block;font-size:11px;padding-right:16px}.iter small{display:block;color:#8b8c96;font-size:9px;margin-top:3px}.iter .x{position:absolute;right:6px;top:5px;border:0;background:transparent;color:#a52820;font-size:12px}.feedback{font-size:10px;color:#777883;background:#f7f7fa;border-radius:9px;padding:7px;margin-top:7px;line-height:1.4}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #e7e7ee;padding:7px 15px;font-size:9px;color:#92939e;text-align:center;z-index:9}.spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:850px){.layout{display:block}aside{display:none}.main{padding:22px 14px 55px}.hero{display:block}.hero h1{font-size:32px}.actions{margin-top:14px}.mapgrid{grid-template-columns:1fr}.mapcanvas{min-height:430px}.maplist{max-height:none}.details{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.footer{font-size:8px}}
</style>
</head>
<body>
<div class="top"><div class="brand"><img class="brand-icon" src="/icon-192.png" alt="Ta-Ta icon">Ta-Ta</div><button id="settingsBtn">⚙ Settings</button></div>
<div class="layout"><aside><div class="sidehead">MY TRIPS <span id="tripCount"></span></div><div id="tripList"></div><button class="new" id="newTrip">＋ New trip</button></aside><main class="main" id="app"></main></div>
<div class="footer">Ta-Ta · Your trips stay in this browser · Always verify current opening hours, closures and availability before travelling.</div>
<div id="modalRoot"></div>
<script>
const TRIPS='my_ai_maps_trips_v2', KEYS='my_ai_maps_keys_v2';
let trips=load(TRIPS,[]), keys=load(KEYS,{maps:''}), selected=trips[0]?.id||null, tab='itinerary', map=null, markers=[];delete keys.gemini;save(KEYS,keys);
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}} function save(k,v){localStorage.setItem(k,JSON.stringify(v))} function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function days(a,b){return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000)+1)} function addDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function mapsUrl(p,dir=false){if(p.id)return dir?`https://www.google.com/maps/dir/?api=1&destination=place_id:${encodeURIComponent(p.id)}`:`https://www.google.com/maps/search/?api=1&query=Google&query_place_id=${encodeURIComponent(p.id)}`;return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name||'')}`}
async function loadMaps(){if(!keys.maps)return false;if(window.google?.maps)return true;return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(keys.maps)+'&v=weekly';s.async=true;s.defer=true;s.onload=()=>resolve(true);s.onerror=()=>reject(new Error('Google Maps failed to load. Check the browser key and enabled APIs.'));document.head.appendChild(s)})}
async function autocomplete(input){try{await loadMaps();const {PlaceAutocompleteElement}=await google.maps.importLibrary('places');let host=input.parentElement;host.innerHTML='';let el=new PlaceAutocompleteElement();el.setAttribute('placeholder','Where do you want to go?');el.style.width='100%';el.addEventListener('gmp-select',async e=>{let p=e.placePrediction.toPlace();await p.fetchFields({fields:['displayName','formattedAddress','location','id']});input._selected={name:p.displayName||'',address:p.formattedAddress||'',lat:p.location?.lat?.()??null,lng:p.location?.lng?.()??null,id:p.id||''};input.value=p.displayName||''});host.appendChild(el);return true}catch(e){console.warn(e);return false}}
async function gemini(trip,feedback='',base=null){let r=await fetch('/api/itinerary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trip:{destination:trip.destination,start:trip.start,end:trip.end,travelers:trip.travelers,style:trip.style,budget:trip.budget,notes:trip.notes||''},feedback,base})});let data=await r.json().catch(()=>({error:'The server returned an unreadable response.'}));if(!r.ok)throw Error(data.error||('AI request failed ('+r.status+').'));return data.itinerary}
function current(){return trips.find(t=>t.id===selected)||null} function updateTrip(fn){trips=trips.map(t=>t.id===selected?fn(t):t);save(TRIPS,trips);render()}
async function verifyDay(day,dayIndex){if(!keys.maps){showSettings();return}let btn=document.querySelector(`[data-verify="${dayIndex}"]`);if(btn)btn.disabled=true;try{await loadMaps();let {Place}=await google.maps.importLibrary('places');let found=[];for(let i=0;i<(day.items||[]).length;i++){let x=day.items[i];if(!x.placeQuery||x.category==='free-time'||x.category==='transport')continue;let q=`${x.placeQuery} in ${current().destination}`;let z=await Place.searchByText({textQuery:q,fields:['id','displayName','formattedAddress','location','rating','userRatingCount','googleMapsURI'],maxResultCount:1,language:'en-US',region:'IN'});let p=z.places?.[0];if(p)found.push({id:p.id,name:p.displayName||x.name,address:p.formattedAddress||'',lat:p.location?.lat?.()??null,lng:p.location?.lng?.()??null,rating:p.rating,userRatingCount:p.userRatingCount,dayIndex,itemIndex:i})}updateTrip(t=>({...t,verified:[...(t.verified||[]).filter(p=>p.dayIndex!==dayIndex),...found]}));tab='itinerary'}catch(e){alert(e.message)}finally{if(btn)btn.disabled=false}}
async function initMap(){let t=current();if(!t)return;try{await loadMaps();let {Map}=await google.maps.importLibrary('maps');let center=t.destinationData?.lat?{lat:t.destinationData.lat,lng:t.destinationData.lng}:{lat:20.59,lng:78.96};map=new Map($('#map'),{center,zoom:t.destinationData?.lat?12:4,mapTypeControl:false,streetViewControl:false,fullscreenControl:true,mapId:'DEMO_MAP_ID'});drawMarkers()}catch(e){$('#map').innerHTML='<div class="empty">Google Maps could not load.<br>Check your key, billing and enabled APIs.</div>'}}
async function drawMarkers(){if(!map)return;let {AdvancedMarkerElement}=await google.maps.importLibrary('marker');markers.forEach(m=>m.map=null);markers=[];let ps=(current()?.verified||[]).filter(p=>p.lat!=null);if(!ps.length)return;let b=new google.maps.LatLngBounds();ps.forEach(p=>{let m=new AdvancedMarkerElement({map,position:{lat:p.lat,lng:p.lng},title:p.name});markers.push(m);b.extend({lat:p.lat,lng:p.lng})});if(ps.length===1){map.setCenter({lat:ps[0].lat,lng:ps[0].lng});map.setZoom(14)}else map.fitBounds(b,60)}
function placeHtml(p){return `<div class="place"><b>${esc(p.name)}</b><small>${esc(p.address)}</small>${p.rating?`<div class="rating">★ ${Number(p.rating).toFixed(1)}${p.userRatingCount?` · ${Number(p.userRatingCount).toLocaleString()} reviews`:''}</div>`:''}<div class="placeactions"><a target="_blank" href="${mapsUrl(p,true)}">🧭 Directions</a><a target="_blank" href="${mapsUrl(p)}">↗ Google Maps</a></div></div>`}
function render(){let t=current();$('#tripCount').textContent=trips.length;$('#tripList').innerHTML=trips.map(x=>`<button class="trip ${x.id===selected?'active':''}" onclick="selected='${x.id}';tab='itinerary';render()"><div class="pin">⌖</div><div><b>${esc(x.destination)}</b><small>${esc(x.start)} → ${esc(x.end)}</small></div></button>`).join('');if(!t){$('#app').innerHTML=`<div class="empty" style="margin-top:80px"><div><div style="font-size:30px">✦</div><b>Start your next trip with Ta-Ta</b><div>Gemini builds the plan. Google Places verifies the real locations. Google Maps gets you there.</div><button class="primary" style="margin-top:14px" onclick="showCreate()">＋ Create trip</button></div></div>`;return}
let it=t.itinerary, verified=t.verified||[], its=t.iterations||[];$('#app').innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR TRIP</div><h1>${esc(it?.tripTitle||t.destination)}</h1><div class="muted">${esc(t.start)} → ${esc(t.end)} · ${esc(t.travelers)} traveller${t.travelers==1?'':'s'} · ${esc(t.style)}</div>${t.destinationData?.address?`<div class="muted">⌖ ${esc(t.destinationData.address)}</div>`:''}</div><div class="actions"><button class="primary" id="aiBtn">✦ ${it?'Rebuild with AI':'Build my itinerary'}</button><button class="secondary danger" id="delBtn">Delete</button></div></div>${it?.summary?`<div class="summary">${esc(it.summary)}</div>`:''}${its.length?`<div class="iterations"><div class="iterhead"><b>Itinerary versions</b><span class="muted">${its.length} saved</span></div><div class="iterlist">${its.map((v,i)=>`<div class="iter ${v.id===t.activeIteration?'active':''}"><button class="iter" style="border:0;padding:0;min-width:0;background:transparent;box-shadow:none" onclick="openIteration('${v.id}')"><strong>Version ${i+1}</strong><small>${new Date(v.createdAt).toLocaleString()}</small><div class="feedback">${esc(v.feedback||'Original AI plan')}</div></button><button class="x" onclick="deleteIteration('${v.id}')">×</button></div>`).join('')}</div></div>`:''}<div class="tabs"><button class="${tab==='itinerary'?'active':''}" onclick="tab='itinerary';render()">☷ Itinerary</button><button class="${tab==='map'?'active':''}" onclick="tab='map';render()">⌖ Map (${verified.length})</button><button class="${tab==='details'?'active':''}" onclick="tab='details';render()">⚙ Details</button></div>${tab==='itinerary'?renderItinerary(t,it,verified):tab==='map'?renderMap(t,verified):renderDetails(t)}`;
$('#aiBtn').onclick=buildAI;$('#delBtn').onclick=()=>{if(confirm('Delete this trip?')){trips=trips.filter(x=>x.id!==t.id);selected=trips[0]?.id||null;save(TRIPS,trips);render()}}}
function renderItinerary(t,it,verified){if(!it)return `<div class="empty"><div><b>Your itinerary is ready for AI.</b><div>Press “Build my itinerary” to generate it.</div></div></div>`;return `<div>${(it.days||[]).map((d,i)=>`<section class="day"><div class="dayhead"><div><div class="eyebrow">DAY ${i+1} · ${esc(d.date||addDays(t.start,i))}</div><h3>${esc(d.title)}</h3></div><button class="verify" data-verify="${i}" onclick='verifyDay(${JSON.stringify(d)},${i})'>⌕ Verify places</button></div>${(d.items||[]).map((x,j)=>{let p=verified.find(v=>v.dayIndex===i&&v.itemIndex===j);return `<div class="row"><div class="time">${esc(x.time)}</div><div class="dot"></div><div class="act"><div class="tag">${esc(x.category)} · ${esc(x.transport)}</div><h4>${esc(x.name)}</h4><p>${esc(x.description)}</p>${p?placeHtml(p):x.placeQuery?`<div class="unverified">⌖ ${esc(x.placeQuery)}</div>`:''}</div></div>`}).join('')}</section>`).join('')}</div>`}
function renderMap(t,verified){return `<div class="mapgrid"><div class="maplist"><h3>Verified places · ${verified.length}</h3>${verified.length?verified.map(placeHtml).join(''):`<div class="empty" style="min-height:180px"><div>Verify one or more itinerary days to place real Google Places here.</div></div>`}</div><div class="mapcanvas" id="map"></div></div>`}
function renderDetails(t){return `<div class="details"><div><b>Dates</b><span>${esc(t.start)} → ${esc(t.end)}</span></div><div><b>Travellers</b><span>${esc(t.travelers)}</span></div><div><b>Style</b><span>${esc(t.style)}</span></div><div><b>Budget</b><span>${esc(t.budget)}</span></div><div style="grid-column:1/-1"><b>Notes</b><span>${esc(t.notes||'None')}</span></div></div>`}
function openFeedback(){let t=current();if(!t)return;let r=$('#modalRoot');r.innerHTML=`<div class="modalback"><form class="modal" onsubmit="rebuildWithFeedback(event)"><div class="modalhead"><div><div class="eyebrow">AI REVISION</div><h2>What should I change?</h2></div><button type="button" class="close" onclick="closeModal()">✕</button></div><p class="muted">Tell Gemini what you want changed. The current itinerary will be kept as a separate version.</p><label>Your feedback</label><textarea id="feedback" autofocus placeholder="Example: Make Day 2 more relaxed, remove shopping, add more local food and move the museum to Day 3."></textarea><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">✦ Create new version</button></div></form></div>`}
async function rebuildWithFeedback(e){e.preventDefault();let feedback=$('#feedback').value.trim();if(!feedback)return;closeModal();let t=current(),b=$('#aiBtn');b.disabled=true;b.innerHTML='⟳ Revising…';try{let it=await gemini(t,feedback,t.itinerary);let v={id:id(),createdAt:Date.now(),feedback,itinerary:it,verified:[]};updateTrip(x=>{let arr=[...(x.iterations||[])];if(x.itinerary&&!arr.some(q=>q.id===x.activeIteration)){arr.push({id:x.activeIteration||id(),createdAt:x.updatedAt||Date.now(),feedback:'Original itinerary',itinerary:x.itinerary,verified:x.verified||[]})}return {...x,iterations:[...arr,v],activeIteration:v.id,itinerary:it,verified:[]}})}catch(e){alert(e.message)}finally{b.disabled=false;b.innerHTML='✦ Rebuild with AI'}}
async function buildAI(){let t=current();if(t.itinerary){openFeedback();return}let b=$('#aiBtn');b.disabled=true;b.innerHTML='⟳ Building…';try{let it=await gemini(t);let v={id:id(),createdAt:Date.now(),feedback:'Original itinerary',itinerary:it,verified:[]};updateTrip(x=>({...x,itinerary:it,verified:[],iterations:[...(x.iterations||[]),v],activeIteration:v.id,updatedAt:Date.now()}))}catch(e){alert(e.message)}finally{b.disabled=false;b.innerHTML='✦ Build my itinerary'}}
function openIteration(iterId){let t=current(),v=(t.iterations||[]).find(x=>x.id===iterId);if(!v)return;updateTrip(x=>({...x,activeIteration:v.id,itinerary:v.itinerary,verified:v.verified||[]}))}
function deleteIteration(iterId){let t=current(),arr=t.iterations||[];if(arr.length<=1){alert('Keep at least one itinerary version.');return}if(!confirm('Delete this itinerary version?'))return;let next=arr.filter(x=>x.id!==iterId);let active=t.activeIteration===iterId?next[next.length-1]:next.find(x=>x.id===t.activeIteration)||next[next.length-1];updateTrip(x=>({...x,iterations:next,activeIteration:active.id,itinerary:active.itinerary,verified:active.verified||[]}))}
function showSettings(){let r=$('#modalRoot');r.innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><div><div class="eyebrow">SETUP</div><h2>Ta-Ta · Google Maps</h2></div><button class="close" onclick="closeModal()">✕</button></div><p class="muted">Your Gemini key is securely configured once in Cloudflare Pages as a secret. You do not need to paste it here or store it in your browser. This setting is only for the Google Maps browser key; restrict it to your site and required APIs.</p><label>Google Maps Platform browser key</label><input id="mkey" type="password" value="${esc(keys.maps||'')}" placeholder="Google Maps browser key"><div class="keysbox"><b>Enable in Google Cloud</b><span>Maps JavaScript API</span><span>Places API (New)</span></div><div class="modalfoot"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveSettings()">Save Maps key</button></div></div></div>`} 
function saveSettings(){keys={...keys,maps:$('#mkey').value.trim()};delete keys.gemini;save(KEYS,keys);closeModal();render()}
function closeModal(){$('#modalRoot').innerHTML=''}
function showCreate(){let today=new Date().toISOString().slice(0,10);let r=$('#modalRoot');r.innerHTML=`<div class="modalback"><form class="modal" onsubmit="createTrip(event)"><div class="modalhead"><div><div class="eyebrow">NEW TRIP</div><h2>Plan somewhere you want to be</h2></div><button type="button" class="close" onclick="closeModal()">✕</button></div><label>Destination</label><div id="autoHost"><input id="dest" placeholder="e.g. Kyoto, Japan"></div><div class="hint">Google Places autocomplete is available after you save a Maps key.</div><div class="grid2"><div><label>Start</label><input id="start" type="date" value="${today}"></div><div><label>End</label><input id="end" type="date" value="${addDays(today,4)}"></div></div><div class="grid3"><div><label>Travellers</label><input id="trav" type="number" min="1" value="2"></div><div><label>Style</label><select id="style"><option>Relaxed</option><option selected>Balanced</option><option>Active</option><option>Family</option><option>Luxury</option><option>Food-focused</option></select></div><div><label>Budget</label><select id="budget"><option>Budget</option><option selected>Comfortable</option><option>Premium</option><option>Flexible</option></select></div></div><label>Notes / must-do ideas</label><textarea id="notes" placeholder="Beaches, museums, vegetarian food, shopping, slow mornings…"></textarea><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Create trip</button></div></form></div>`;if(keys.maps)autocomplete($('#dest'))}
function createTrip(e){e.preventDefault();let d=$('#dest'),t={id:id(),destination:d.value.trim(),destinationData:d._selected||null,start:$('#start').value,end:$('#end').value,travelers:Number($('#trav').value),style:$('#style').value,budget:$('#budget').value,notes:$('#notes').value,itinerary:null,verified:[],iterations:[],activeIteration:null};if(!t.destination)return;trips=[t,...trips];selected=t.id;save(TRIPS,trips);closeModal();render()}
$('#settingsBtn').onclick=showSettings;$('#newTrip').onclick=showCreate;render();
</script></body></html>
